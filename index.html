<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六張犁青創・活動報名</title>
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>

:root{
  --paper:#FAF5EA;
  --paper-line:#E4DAC4;
  --ink:#2B2620;
  --ink-soft:#6B6153;
  --teal:#1F6F63;
  --teal-deep:#153F38;
  --apricot:#F0A057;
  --apricot-deep:#C97A2E;
  --card:#FFFFFF;
  --grey:#B9AF9C;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, var(--paper-line) 1px, transparent 1px) 0 0/22px 22px,
    var(--paper);
  color:var(--ink);
  font-family:'Noto Serif TC', serif;
  min-height:100vh;
  padding:0 0 60px;
}

.wrap{max-width:760px;margin:0 auto;padding:0 20px;}

header{
  padding:48px 20px 28px;
  text-align:center;
  position:relative;
}
.logo{
  width:74px;
  height:auto;
  margin:0 auto 14px;
  display:block;
  filter:drop-shadow(0 4px 8px rgba(43,38,32,.18));
}
.eyebrow{
  font-size:13px;
  letter-spacing:.28em;
  color:var(--teal);
  font-weight:700;
  text-transform:uppercase;
}
h1{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  margin:10px 0 6px;
  color:var(--teal-deep);
  line-height:1.3;
}
h1 .title-line1{
  display:block;
  font-size:clamp(15px,2.6vw,19px);
  font-weight:700;
  letter-spacing:.14em;
  color:var(--teal);
  margin-bottom:6px;
}
h1 .title-line2{
  display:block;
  font-size:clamp(28px,6vw,42px);
  letter-spacing:.22em;
}
.month-tag{
  display:inline-block;
  margin-top:6px;
  padding:6px 18px;
  background:var(--teal);
  color:#fff;
  font-weight:700;
  font-size:15px;
  border-radius:999px;
  letter-spacing:.05em;
}
.sub{
  margin-top:14px;
  font-size:14px;
  color:var(--ink-soft);
}

#list{margin-top:34px;display:flex;flex-direction:column;gap:18px;}

.ticket{
  position:relative;
  display:flex;
  background:var(--card);
  border-radius:14px;
  box-shadow:0 2px 0 var(--paper-line), 0 10px 24px -14px rgba(43,38,32,.35);
  overflow:hidden;
  animation:rise .5s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.date-block{
  flex:0 0 96px;
  background:var(--teal-deep);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:16px 8px;
  position:relative;
}
.date-block .day{
  font-family:'Noto Serif TC',serif;
  font-weight:900;
  font-size:32px;
  line-height:1;
}
.date-block .mon{font-size:12px;letter-spacing:.1em;opacity:.85;margin-top:4px;}
.date-block .wk{font-size:11px;margin-top:2px;color:var(--apricot);font-weight:700;}

.perf{
  flex:0 0 0;
  width:0;
  position:relative;
  border-left:2px dashed var(--paper-line);
}
.perf::before,.perf::after{
  content:"";
  position:absolute;
  left:-9px;
  width:18px;height:18px;
  background:var(--paper);
  border-radius:50%;
}
.perf::before{top:-9px;}
.perf::after{bottom:-9px;}

.info{
  flex:1;
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  min-width:0;
}
.ename{
  font-size:17px;
  font-weight:700;
  color:var(--ink);
  word-break:break-word;
}
.etime{
  font-size:13px;
  color:var(--ink-soft);
  display:flex;
  align-items:center;
  gap:6px;
}
.etime svg{width:14px;height:14px;stroke:var(--ink-soft);}

.action{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  padding:0 16px;
}
.ticket-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  text-decoration:none;
  color:var(--teal-deep);
  font-size:11px;
  font-weight:700;
  padding:8px 10px;
  border-radius:10px;
  transition:transform .15s ease, background .15s ease;
}
.ticket-btn .icon-circle{
  width:40px;height:40px;
  border-radius:50%;
  background:var(--apricot);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px -4px rgba(201,122,46,.6);
}
.ticket-btn .icon-circle svg{width:19px;height:19px;stroke:#fff;fill:none;}
.ticket-btn:hover{transform:translateY(-2px);}
.ticket-btn:hover .icon-circle{background:var(--apricot-deep);}

.ticket-btn.disabled{
  color:var(--grey);
  cursor:default;
  pointer-events:none;
}
.ticket-btn.disabled .icon-circle{
  background:#EFE9DC;
  box-shadow:none;
}
.ticket-btn.disabled .icon-circle svg{stroke:var(--grey);}

.state-box{
  margin-top:40px;
  text-align:center;
  color:var(--ink-soft);
  font-size:14px;
  padding:40px 20px;
}
.spinner{
  width:28px;height:28px;
  border-radius:50%;
  border:3px solid var(--paper-line);
  border-top-color:var(--teal);
  margin:0 auto 14px;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

footer{
  text-align:center;
  margin-top:44px;
  font-size:12px;
  color:var(--grey);
  line-height:1.9;
}

.skeleton{
  height:88px;
  border-radius:14px;
  background:linear-gradient(90deg, #EFE9DC 25%, #F6F1E5 37%, #EFE9DC 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s ease infinite;
}
@keyframes shimmer{
  0%{background-position:100% 0;}
  100%{background-position:0 0;}
}
.refresh-note{
  text-align:center;
  font-size:12px;
  color:var(--teal);
  margin-top:10px;
  min-height:16px;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}
.tab-btn{
  font-family:'Noto Serif TC', serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:.05em;
  padding:9px 22px;
  border-radius:999px;
  border:1.5px solid var(--teal);
  background:transparent;
  color:var(--teal);
  cursor:pointer;
  transition:background .15s ease, color .15s ease, transform .15s ease;
}
.tab-btn:hover{transform:translateY(-1px);}
.tab-btn.active{
  background:var(--teal);
  color:#fff;
  box-shadow:0 6px 14px -8px rgba(31,111,99,.6);
}

@media (max-width:480px){
  .date-block{flex-basis:78px;padding:12px 4px;}
  .date-block .day{font-size:26px;}
  .action{padding:0 10px;}
}
</style>
</head>

<script>
const SHEET_ID = "1R4KEjNWc9GPGJHasNF4kmdLHKX_7yVKOhFyhLpN06b8";
const SHEET_NAME = "表單回覆 1";
const CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(SHEET_NAME);

const WEEKDAYS = ["日","一","二","三","四","五","六"];

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function parseActivityDate(s){
  if(!s) return null;
  s = s.trim();
  const m = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(!m) return null;
  return { y:+m[1], mo:+m[2], d:+m[3] };
}

function parseActivityTime(s){
  if(!s) return { h:0, m:0, label:"" };
  s = s.trim();
  const pm = s.indexOf("下午") !== -1;
  const am = s.indexOf("上午") !== -1;
  const clean = s.replace("上午","").replace("下午","").trim();
  const parts = clean.split(":").map(x => parseInt(x,10) || 0);
  let h = parts[0] || 0, m = parts[1] || 0;
  if(pm && h < 12) h += 12;
  if(am && h === 12) h = 0;
  const label = (pm ? "下午 " : am ? "上午 " : "") + String(parts[0]||0).padStart(2,"0") + ":" + String(m).padStart(2,"0");
  return { h, m, label: label.trim() };
}

function normalizeUrl(raw){
  if(!raw) return null;
  const s = raw.trim();
  if(!s) return null;
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[\w.-]+\.[a-z]{2,}([\/?#].*)?$/i.test(s)) return "https://" + s;
  return null;
}

function monthRangeFromOffset(offset){
  const now = new Date();
  let y = now.getFullYear(), mo = now.getMonth() + 1;
  mo += offset;
  while(mo > 12){ mo -= 12; y += 1; }
  while(mo < 1){ mo += 12; y -= 1; }
  return { y, mo };
}

function showSkeleton(){
  const listEl = document.getElementById("list");
  listEl.innerHTML = [0,1,2].map(() => '<div class="skeleton"></div>').join("");
}

function isEventPast(date){
  const now = new Date();
  const today = { y: now.getFullYear(), mo: now.getMonth() + 1, d: now.getDate() };
  if(date.y !== today.y) return date.y < today.y;
  if(date.mo !== today.mo) return date.mo < today.mo;
  return date.d < today.d; // 活動當天仍算開放，隔天才視為截止
}

function renderEvents(events, targetY, targetMo){
  const listEl = document.getElementById("list");
  const stateBox = document.getElementById("stateBox");

  if(events.length === 0){
    listEl.innerHTML = "";
    stateBox.style.display = "block";
    stateBox.innerHTML = "目前 " + targetY + " 年 " + targetMo + " 月尚未公告任何活動，請稍後再回來看看。";
    return;
  }

  stateBox.style.display = "none";
  listEl.innerHTML = events.map((ev, idx) => {
    const wk = new Date(ev.date.y, ev.date.mo - 1, ev.date.d).getDay();
    const ticketIcon = '<span class="icon-circle"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z" stroke-width="1.8" stroke-linejoin="round"/></svg></span>';
    let linkPart;
    if(isEventPast(ev.date)){
      linkPart = '<span class="ticket-btn disabled">' + ticketIcon + '已截止</span>';
    } else if(ev.link){
      linkPart = '<a class="ticket-btn" href="' + ev.link + '" target="_blank" rel="noopener noreferrer">' + ticketIcon + '我要報名</a>';
    } else {
      linkPart = '<span class="ticket-btn disabled">' + ticketIcon + '尚未開放</span>';
    }
    return (
      '<div class="ticket" style="animation-delay:' + (idx * 0.04) + 's">' +
        '<div class="date-block">' +
          '<div class="day">' + ev.date.d + '</div>' +
          '<div class="mon">' + ev.date.mo + '月</div>' +
          '<div class="wk">星期' + WEEKDAYS[wk] + '</div>' +
        '</div>' +
        '<div class="perf"></div>' +
        '<div class="info">' +
          '<div class="ename">' + escapeHtml(ev.name) + '</div>' +
          '<div class="etime"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke-width="1.6" stroke-linecap="round"/></svg>' + (ev.time.label || "時間未定") + '</div>' +
        '</div>' +
        '<div class="action">' + linkPart + '</div>' +
      '</div>'
    );
  }).join("");
}

function eventsToPlain(events){
  return events.map(ev => ({ date: ev.date, time: ev.time, name: ev.name, link: ev.link }));
}

function parseTimestamp(s){
  if(!s) return 0;
  const tokens = s.trim().split(/\s+/);
  const datePart = tokens[0];
  const restPart = tokens.slice(1).join(" ");
  const date = parseActivityDate(datePart);
  const time = parseActivityTime(restPart);
  if(!date) return 0;
  const sec = (restPart.split(":")[2] && parseInt(restPart.split(":")[2], 10)) || 0;
  return ((date.y * 100 + date.mo) * 100 + date.d) * 1000000
       + (time.h * 100 + time.m) * 100 + sec;
}

async function fetchFreshEvents(targetY, targetMo){
  const res = await fetch(CSV_URL, { cache: "no-store" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  const rows = parseCSV(text).filter(r => r.length > 1 && r.some(c => c && c.trim()));
  const dataRows = rows.slice(1);

  // Step 1: filter to target month, keep the row's original position for stable fallback keys
  const candidates = [];
  dataRows.forEach((r, idx) => {
    const dateStr = r[1], timeStr = r[2], name = (r[3]||"").trim(), linkStr = r[4], codeStr = (r[5]||"").trim();
    const date = parseActivityDate(dateStr);
    if(!date) return;
    if(date.y !== targetY || date.mo !== targetMo) return;
    const time = parseActivityTime(timeStr);
    const ts = parseTimestamp(r[0]);
    candidates.push({ date, time, name: name || "（未命名活動）", link: normalizeUrl(linkStr), code: codeStr, ts, idx });
  });

  // Step 2: dedupe by 活動代碼（F 欄）— 同一代碼在同月份內只保留時間戳記最晚的一筆
  // 沒有填活動代碼的列視為各自獨立，不與其他列合併
  const latestByCode = new Map();
  for(const c of candidates){
    const key = c.code ? ("code:" + c.code) : ("row:" + c.idx);
    const existing = latestByCode.get(key);
    if(!existing || c.ts >= existing.ts){
      latestByCode.set(key, c);
    }
  }
  const events = Array.from(latestByCode.values()).map(c => ({
    date: c.date, time: c.time, name: c.name, link: c.link
  }));

  events.sort((a,b) => {
    if(a.date.d !== b.date.d) return a.date.d - b.date.d;
    if(a.time.h !== b.time.h) return a.time.h - b.time.h;
    return a.time.m - b.time.m;
  });

  return events;
}

let currentView = "next"; // "current" = 本月, "next" = 下個月；報名連結截止日以活動當天為準
let loadToken = 0;

async function load(view){
  currentView = view;
  const myToken = ++loadToken;

  const stateBox = document.getElementById("stateBox");
  const monthTag = document.getElementById("monthTag");
  const footer = document.getElementById("footer");
  const refreshNote = document.getElementById("refreshNote");

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === view);
  });

  const offset = view === "current" ? 0 : 1;
  const { y: targetY, mo: targetMo } = monthRangeFromOffset(offset);
  monthTag.textContent = targetY + " 年 " + targetMo + " 月活動";
  const cacheKey = "events-cache-" + targetY + "-" + targetMo;

  refreshNote.textContent = "";
  stateBox.style.display = "none";

  // Step 1: try to instantly show last-known-good data from shared cache
  let hadCache = false;
  try{
    const cached = await window.storage.get(cacheKey, true);
    if(myToken !== loadToken) return; // a newer tab switch happened while awaiting
    if(cached && cached.value){
      const parsed = JSON.parse(cached.value);
      if(parsed && parsed.events && parsed.events.length){
        hadCache = true;
        renderEvents(parsed.events, targetY, targetMo);
        refreshNote.textContent = "顯示上次讀取的資料，正在確認是否有更新…";
        footer.textContent = "資料來源：民眾活動報名連結總表（Google 試算表）・上次讀取：" + new Date(parsed.savedAt).toLocaleString("zh-TW");
      }
    }
  } catch(e){ /* no cache yet, ignore */ }

  if(myToken !== loadToken) return;

  if(!hadCache){
    showSkeleton();
    stateBox.style.display = "block";
    stateBox.innerHTML = '<div class="spinner"></div>正在抓取最新活動資料…';
  }

  // Step 2: fetch fresh data in the background and update
  try{
    const events = await fetchFreshEvents(targetY, targetMo);
    if(myToken !== loadToken) return; // stale response, a different tab is now active
    renderEvents(events, targetY, targetMo);
    refreshNote.textContent = "";
    const now = new Date();
    footer.textContent = "資料來源：民眾活動報名連結總表（Google 試算表）・上次更新讀取：" + now.toLocaleString("zh-TW");

    try{
      await window.storage.set(cacheKey, JSON.stringify({ events: eventsToPlain(events), savedAt: now.toISOString() }), true);
    } catch(e){ /* storage write failed, non-fatal */ }
  } catch(err){
    if(myToken !== loadToken) return;
    if(hadCache){
      refreshNote.textContent = "目前無法連上最新資料，暫時顯示上次讀取的內容。";
    } else {
      stateBox.style.display = "block";
      stateBox.innerHTML = "資料讀取失敗，請重新整理頁面再試一次。<br><span style='font-size:12px'>(" + (err.message || err) + ")</span>";
    }
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if(btn.dataset.view !== currentView) load(btn.dataset.view);
  });
});

load(currentView);
</script>
